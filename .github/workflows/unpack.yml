name: Expand Care Ledger application source
on:
  push:
    paths:
      - "runtime.part3"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and expand application source
        run: |
          set -euo pipefail
          cat runtime.part1 runtime.part2 runtime.part3 | base64 --decode > /tmp/care-ledger-runtime.tar.xz
          tar -xJf /tmp/care-ledger-runtime.tar.xz
          test -f server.js
          test -f package.json
          test -f public/index.html
          rm runtime.part1 runtime.part2 runtime.part3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Care Ledger Node.js application" || exit 0
          git push origin HEAD:main
